[project]
name = "vocab-deck"
version = "0.6.0"
description = "GRE/GregMat vocabulary trainer with daily exercises, spaced repetition, and level-based personalization"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pypdf>=6.7.4",
    "requests>=2.31.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "anthropic>=0.25.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=22.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "playwright>=1.40.0",
    "ruff>=0.4.0",
    "pyright>=1.1.360",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "T20",      # flake8-print (no print() in non-script code)
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length enforced by formatter
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]   # print() allowed in scripts
"start.py"  = ["T20"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.14"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
exclude = ["data/", "scripts/"]
